{% extends 'base.html' %}
{% block content %}
<div style="
    width: 65%;
    margin: 35px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
">

    <h1 style="color: #0047ab; font-weight: bold; margin-bottom: 18px;">
        New article
    </h1>

    <form action="" method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 18px;">
            {{ form.as_p }}
        </div>

        <button type="submit"
        style="
            background-color: #0047ab;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        ">
            Save
        </button>
    </form>

</div>
{% endblock content %}
