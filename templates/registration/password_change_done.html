{% extends 'base.html' %}
{% block title %}Password Change Successful{% endblock title %}

{% block content %}
<div style="
    width: 65%;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
">

    <h1 style="color: #0047ab; font-weight: bold; margin-bottom: 10px;">
        Password change successful
    </h1>

    <p style="
        color: #d50000;
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 10px;
    ">
        Your password was changed.
    </p>

</div>
{% endblock content %}
