<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NewsPaper app</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #0047ab, #d50000);
        }

        header {
            background-color: #0047ab;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-bottom: 5px solid #d50000;
        }

        nav {
            background-color: #d50000;
            padding: 12px 25px;
            border-bottom: 4px solid #0047ab;
        }

        nav a {
            color: white;
            font-weight: bold;
            margin-right: 20px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            width: 70%;
            margin: 30px auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            border: 3px solid #0047ab;
        }

        footer {
            background-color: #d50000;
            padding: 10px;
            text-align: center;
            color: white;
            border-top: 5px solid #0047ab;
            margin-top: 20px;
        }
    </style>

</head>
<body>

    <header>
        Daily Planet News
    </header>

    <nav>
        <a href="{% url 'home' %}">Newspaper</a>

        {% if user.is_authenticated %}
            <a href="{% url 'article_new' %}">+ New</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        Powered by Kryptonian Tech
    </footer>

</body>
</html>
