{% extends 'base.html' %}
{% block content %}
<div style="
    width: 60%;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
">

    <h1 style="color: #d50000; font-weight: bold; margin-bottom: 15px;">
        Delete
    </h1>

    <form action="" method="post">
        {% csrf_token %}

        <p style="font-size: 18px; margin-bottom: 20px; color: #222;">
            Are you sure you want to delete  
            <span style="color: #d50000; font-weight: bold;">"{{ article.title }}"</span>?
        </p>

        <button type="submit"
            style="
                background-color: #d50000;
                color: white;
                padding: 10px 18px;
                border: none;
                border-radius: 6px;
                font-weight: bold;
                cursor: pointer;
            ">
            Confirm
        </button>
    </form>

</div>
{% endblock content %}
