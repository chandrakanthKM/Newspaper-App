{% extends 'base.html' %}
{% block title %}Home{% endblock title %}

{% block content %}
<div style="
    width: 70%;
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    text-align: center;
">

    <h1 style="color: #0047ab; font-weight: bold; margin-bottom: 12px;">
        Newspaper app
    </h1>

    <p style="font-size: 18px; color: #222; margin-bottom: 25px;">
        A Newspaper website built with Django.
    </p>

    <a href="{% url 'article_list' %}"
       style="
           background-color: #d50000;
           color: white;
           padding: 10px 18px;
           border-radius: 6px;
           text-decoration: none;
           font-weight: bold;
       ">
        View All Articles
    </a>

</div>
{% endblock content %}
