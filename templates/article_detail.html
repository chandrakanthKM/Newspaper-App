{% extends 'base.html' %}
{% block content %}
<div style="
    width: 70%;
    margin: 30px auto;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    padding: 20px;
">

    <div style="
        padding-bottom: 10px;
        border-bottom: 2px solid #0047ab;
    ">
        <h2 style="color: #0047ab; font-weight: bold; margin-bottom: 5px;">
            {{ object.title }}
        </h2>

        <p style="color: #d50000; font-size: 14px;">
            by {{ object.author }} | {{ object.date }}
        </p>
    </div>

    <div style="
        padding: 15px 5px;
        font-size: 18px;
        line-height: 1.5;
        color: #222;
    ">
        {{ object.body }}
    </div>

    <div style="
        text-align: center;
        margin-top: 15px;
    ">
        <a href="{% url 'article_edit' article.pk %}"
           style="background-color: #0047ab; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold;">
           Edit
        </a>

        <a href="{% url 'article_delete' article.pk %}"
           style="background-color: #d50000; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-left: 10px;">
           Delete
        </a>
    </div>

    <p style="margin-top: 20px; text-align: center;">
        <a href="{% url 'article_list' %}"
           style="text-decoration: none; font-weight: bold; color: #0047ab;">
           Back to All Articles
        </a>
    </p>

</div>
{% endblock content %}
