{% extends 'base.html'%}
{% block title %}Sign Up{% endblock title %}

{% block content %}
<div style="
    width: 65%;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    border: 3px solid #0047ab;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
">

    <h2 style="color: #0047ab; margin-bottom: 20px; font-weight: bold;">
        Sign Up
    </h2>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            {{ form.as_p }}
        </div>

        <button type="submit"
            style="
                background-color: #d50000;
                color: white;
                padding: 8px 15px;
                border-radius: 6px;
                border: none;
                font-weight: bold;
                cursor: pointer;
            ">
            Sign Up
        </button>
    </form>

</div>
{% endblock content %}
